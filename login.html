<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accesso e Registrazione | OSINTHUB-ITA</title>
  <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>
  <header>
    <a class="logo" href="index.html">OSINTHUB<span>-</span><i>I</i>T<b>A</b></a>
    <a class="login-link" href="index.html">← Catalogo</a>
  </header>

  <main>
    <section class="auth-panel">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" id="tabLogin">Accedi</button>
        <button type="button" class="auth-tab" id="tabRegister">Registrati</button>
      </div>

      <h1 id="authHeading">Accedi al tuo account</h1>
      <p id="authSub">Area personale per preferenze, profilo e accesso amministrativo.</p>

      <div id="authStatus" class="auth-status" role="status" hidden></div>

      <form id="authForm">
        <label id="nameField" hidden>
          Nome / Nickname operativo
          <input type="text" id="authName" placeholder="Es. Analista_IT" autocomplete="name">
        </label>
        <label>
          Email
          <input type="email" id="authEmail" required placeholder="nome@dominio.it" autocomplete="email">
        </label>
        <label>
          Password
          <input type="password" id="authPassword" required minlength="6" placeholder="Minimo 6 caratteri" autocomplete="current-password">
        </label>
        <button type="submit" class="action" id="authSubmitBtn">Accedi</button>
      </form>

      <div class="auth-secondary-actions">
        <button type="button" class="btn-secondary" id="guestLoginBtn">Continua come Ospite</button>
        <button type="button" class="link-btn" id="resetPwdBtn">Password dimenticata?</button>
      </div>

      <!-- Pannello Sessione Attiva -->
      <div id="activeAccountBox" class="active-account-box" hidden>
        <p id="activeAccountInfo"></p>
        <div class="welcome-actions">
          <a href="index.html?logged=1" class="action">Vai al Portale</a>
          <a href="admin.html" class="btn-secondary" id="goAdminPanelBtn" hidden>Pannello Admin</a>
          <button type="button" class="btn-cookie-reject" id="logoutBtn">Disconnetti</button>
        </div>
      </div>

      <p class="gate-legal-note">
        <a href="index.html">Torna al catalogo</a> · <a href="legal.html">Privacy, Cookie e condizioni d'uso</a>
      </p>
    </section>
  </main>

  <script>
  'use strict';
  // Configurazione Supabase (inserisci qui URL e Anon Key del tuo progetto Supabase per attivare l'invio email reale)
  const SUPABASE_URL = '';
  const SUPABASE_ANON_KEY = '';
  // Email autorizzata automaticamente come Amministratore (inserisci la tua email admin)
  const ADMIN_EMAILS = ['admin@osinthub-ita.it'];

  const $ = id => document.getElementById(id);
  let mode = new URLSearchParams(location.search).get('mode') === 'register' ? 'register' : 'login';

  function setStatus(msg, isError = false){
    const box = $('authStatus');
    box.hidden = false;
    box.textContent = msg;
    box.style.borderColor = isError ? '#ef4444' : '#22c55e';
    box.style.color = isError ? '#fca5a5' : '#86efac';
  }

  function updateModeUI(){
    const isReg = mode === 'register';
    $('tabLogin').classList.toggle('active', !isReg);
    $('tabRegister').classList.toggle('active', isReg);
    $('nameField').hidden = !isReg;
    $('authHeading').textContent = isReg ? 'Crea un account OSINTHUB-ITA' : 'Accedi al tuo account';
    $('authSubmitBtn').textContent = isReg ? 'Registrati ora' : 'Accedi';
  }

  $('tabLogin').onclick = () => { mode = 'login'; updateModeUI(); };
  $('tabRegister').onclick = () => { mode = 'register'; updateModeUI(); };
  updateModeUI();

  function checkExistingSession(){
    try{
      const user = JSON.parse(localStorage.getItem('osinthub_user') || 'null');
      if(user && !user.guest){
        $('activeAccountBox').hidden = false;
        $('activeAccountInfo').textContent = 'Sessione attiva: ' + (user.name || user.email) + (user.role === 'admin' ? ' [AMMINISTRATORE]' : '');
        if(user.role === 'admin') $('goAdminPanelBtn').hidden = false;
      }
    }catch{}
  }
  checkExistingSession();

  $('authForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('authEmail').value.trim().toLowerCase();
    const password = $('authPassword').value;
    const name = $('authName').value.trim() || email.split('@')[0];
    const isAdmin = ADMIN_EMAILS.includes(email);

    // Se Supabase è configurato, usa API Auth reale con invio email di conferma
    if(SUPABASE_URL && SUPABASE_ANON_KEY){
      try{
        const endpoint = mode === 'register' ? '/auth/v1/signup' : '/auth/v1/token?grant_type=password';
        const res = await fetch(SUPABASE_URL + endpoint, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, data: { name } })
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.error_description || data.msg || 'Errore autenticazione');
        if(mode === 'register'){
          setStatus('Registrazione completata! Controlla la tua casella email per confermare l’account.');
          return;
        }
        const role = (data.user?.app_metadata?.role === 'admin' || isAdmin) ? 'admin' : 'user';
        localStorage.setItem('osinthub_user', JSON.stringify({ email, name, role, token: data.access_token, guest: false }));
        localStorage.setItem('legalSeen', '1');
        location.href = 'index.html?logged=1';
      }catch(err){
        setStatus(err.message, true);
      }
      return;
    }

    // Fallback locale sicuro finché non vengono inserite le chiavi Supabase
    const users = JSON.parse(localStorage.getItem('osinthub_local_accounts') || '{}');
    if(mode === 'register'){
      if(users[email]){
        setStatus('Questa email risulta già registrata. Passa ad "Accedi".', true);
        return;
      }
      users[email] = { name, email, password, role: isAdmin ? 'admin' : 'user', created: new Date().toISOString() };
      localStorage.setItem('osinthub_local_accounts', JSON.stringify(users));
      localStorage.setItem('osinthub_user', JSON.stringify({ email, name, role: users[email].role, guest: false }));
      localStorage.setItem('legalSeen', '1');
      setStatus('Account registrato! Reindirizzamento al portale...');
      setTimeout(() => { location.href = 'index.html?logged=1'; }, 700);
    } else {
      const acc = users[email];
      if(!acc || acc.password !== password){
        setStatus('Credenziali non valide o account non registrato su questo dispositivo.', true);
        return;
      }
      localStorage.setItem('osinthub_user', JSON.stringify({ email, name: acc.name, role: acc.role, guest: false }));
      localStorage.setItem('legalSeen', '1');
      location.href = 'index.html?logged=1';
    }
  };

  $('guestLoginBtn').onclick = () => {
    localStorage.setItem('osinthub_user', JSON.stringify({ name: 'Ospite', guest: true }));
    localStorage.setItem('legalSeen', '1');
    location.href = 'index.html';
  };

  $('resetPwdBtn').onclick = async () => {
    const email = $('authEmail').value.trim().toLowerCase();
    if(!email){
      setStatus('Inserisci prima la tua email nel campo sopra per richiedere il recupero.', true);
      return;
    }
    if(SUPABASE_URL && SUPABASE_ANON_KEY){
      await fetch(SUPABASE_URL + '/auth/v1/recover', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      setStatus('Se l’indirizzo è registrato, riceverai un’email con il link di ripristino password.');
    } else {
      setStatus('Per inviare email reali di recupero password inserisci URL e Anon Key Supabase in login.html.');
    }
  };

  $('logoutBtn')?.addEventListener('click', () => {
    localStorage.removeItem('osinthub_user');
    location.reload();
  });
  </script>
</body>
</html>
