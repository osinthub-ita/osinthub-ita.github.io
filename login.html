<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesso e Registrazione | OSINTHUB-ITA</title><link rel="stylesheet" href="style.css?v=3.1"></head><body><header><a class="logo" href="index.html">OSINTHUB<span>-</span><i>I</i>T<b>A</b></a><a class="login-link" href="index.html">Catalogo</a></header><main><section class="auth-panel"><div class="auth-tabs"><button type="button" id="tabLogin" class="active">Accedi</button><button type="button" id="tabRegister">Registrati</button></div><h1 id="authTitle">Accedi al tuo account</h1><p id="authDesc">Area personale per preferiti, appunti e strumenti salvati.</p><p id="authMsg" role="status" class="auth-status"></p><form id="authForm"><label id="nameLabel" hidden>Nome / Nickname<input type="text" id="authName" placeholder="Es. AnalistaOSINT"></label><label>Email<input type="email" id="authEmail" required autocomplete="email" placeholder="nome@esempio.it"></label><label>Password<input type="password" id="authPassword" required autocomplete="current-password" placeholder="••••••••"></label><button type="submit" id="authSubmit" class="action">Accedi</button></form><div class="auth-secondary"><button type="button" id="btnGuest" class="btn-outline">Continua come Ospite</button><button type="button" id="btnRecover" class="btn-link">Recupera password</button></div><div id="loggedPanel" hidden><p>Accesso effettuato come <strong id="loggedUser"></strong>.</p><button type="button" id="btnGoCatalog" class="action">Vai al Catalogo</button><button type="button" id="btnLogout" class="btn-outline">Esci dall'account</button></div><p class="auth-footer"><a href="index.html">Torna al catalogo</a> · <a href="legal.html">Privacy e condizioni</a></p></section></main><script>
const $=id=>document.getElementById(id);
let mode='login';
const params=new URLSearchParams(location.search);
if(params.get('mode')==='register') mode='register';

function syncMode(){
  $('tabLogin').classList.toggle('active', mode==='login');
  $('tabRegister').classList.toggle('active', mode==='register');
  $('nameLabel').hidden = mode==='login';
  $('authName').required = mode==='register';
  $('authTitle').textContent = mode==='login' ? 'Accedi al tuo account' : 'Crea un nuovo account';
  $('authSubmit').textContent = mode==='login' ? 'Accedi' : 'Registrati';
  $('authMsg').textContent = '';
}

function checkSession(){
  const user = JSON.parse(localStorage.getItem('osinthub_user') || 'null');
  if(user && !user.guest){
    $('authForm').hidden = true;
    $('tabLogin').parentElement.hidden = true;
    document.querySelector('.auth-secondary').hidden = true;
    $('authTitle').textContent = 'Profilo Utente';
    $('loggedPanel').hidden = false;
    $('loggedUser').textContent = user.name || user.email;
  } else {
    $('authForm').hidden = false;
    $('tabLogin').parentElement.hidden = false;
    document.querySelector('.auth-secondary').hidden = false;
    $('loggedPanel').hidden = true;
    syncMode();
  }
}

$('tabLogin').onclick = () => { mode='login'; syncMode(); };
$('tabRegister').onclick = () => { mode='register'; syncMode(); };

$('authForm').onsubmit = e => {
  e.preventDefault();
  const email = $('authEmail').value.trim().toLowerCase();
  const pass = $('authPassword').value;
  const name = $('authName').value.trim();
  const users = JSON.parse(localStorage.getItem('osinthub_users') || '{}');

  if(mode === 'register'){
    if(users[email]){
      $('authMsg').textContent = 'Questa email è già registrata. Prova ad accedere.';
      $('authMsg').className = 'auth-status red';
      return;
    }
    users[email] = { name: name || email.split('@')[0], email, pass };
    localStorage.setItem('osinthub_users', JSON.stringify(users));
    localStorage.setItem('osinthub_user', JSON.stringify({ name: users[email].name, email, guest: false }));
    localStorage.setItem('legalSeen', '1');
    $('authMsg').textContent = 'Registrazione completata! Reindirizzamento...';
    $('authMsg').className = 'auth-status green';
    setTimeout(() => location.href = 'index.html', 800);
  } else {
    if(users[email] && users[email].pass === pass){
      localStorage.setItem('osinthub_user', JSON.stringify({ name: users[email].name, email, guest: false }));
      localStorage.setItem('legalSeen', '1');
      $('authMsg').textContent = 'Accesso riuscito! Reindirizzamento...';
      $('authMsg').className = 'auth-status green';
      setTimeout(() => location.href = 'index.html', 800);
    } else {
      $('authMsg').textContent = 'Credenziali non valide o utente non registrato.';
      $('authMsg').className = 'auth-status red';
    }
  }
};

$('btnGuest').onclick = () => {
  localStorage.setItem('osinthub_user', JSON.stringify({ name: 'Ospite', guest: true }));
  localStorage.setItem('legalSeen', '1');
  location.href = 'index.html';
};

$('btnRecover').onclick = () => {
  const email = $('authEmail').value.trim().toLowerCase();
  if(!email){
    $('authMsg').textContent = 'Inserisci la tua email nel campo sopra per recuperare la password.';
    $('authMsg').className = 'auth-status amber';
    return;
  }
  const users = JSON.parse(localStorage.getItem('osinthub_users') || '{}');
  if(users[email]){
    $('authMsg').textContent = 'Istruzioni di recupero inviate (Modalità locale: password attiva per ' + email + ').';
    $('authMsg').className = 'auth-status green';
  } else {
    $('authMsg').textContent = 'Nessun account trovato con questa email.';
    $('authMsg').className = 'auth-status red';
  }
};

$('btnGoCatalog').onclick = () => location.href = 'index.html';
$('btnLogout').onclick = () => {
  localStorage.removeItem('osinthub_user');
  checkSession();
};

checkSession();
</script></body></html>
