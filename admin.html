<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><main><a href="index.html">← Catalogo</a><h1>Editor locale del catalogo</h1><p>Non è un’area amministrativa autenticata. Modifica una copia del catalogo e scarica il JSON da sostituire su GitHub.</p><select id="pick"></select><button id="add">Nuova risorsa</button><form id="f"><label>Nome <input id="n" required></label><label>URL HTTPS <input id="u" type="url" required></label><label>Categoria <input id="c" required></label><label>Costo <select id="p"><option>Gratuito</option><option>Freemium</option><option>A pagamento</option></select></label><label>Descrizione <textarea id="d"></textarea></label><button>Salva nella copia locale</button></form><button id="download">Scarica resources.json</button><p id="msg"></p></main><script>const $=x=>document.getElementById(x);let a=[],id=null;function fill(){let s=$('pick');s.replaceChildren();for(let r of a){let o=document.createElement('option');o.value=r.id;o.textContent=r.name;s.append(o)}if(a.length)load(a[0].id)}function load(i){let r=a.find(x=>x.id==i);id=r.id;for(let [k,v] of Object.entries({n:r.name,u:r.url,c:r.category,p:r.price,d:r.description}))$(k).value=v}$('pick').onchange=e=>load(e.target.value);$('add').onclick=()=>{id=null;$('f').reset()};$('f').onsubmit=e=>{e.preventDefault();if(!$('u').value.startsWith('https://'))return;let r={id:id??Math.max(0,...a.map(x=>x.id))+1,name:$('n').value,url:$('u').value,category:$('c').value,price:$('p').value,description:$('d').value,status:'Da verificare'};a=a.filter(x=>x.id!==r.id);a.push(r);fill();$('msg').textContent='Modifica salvata in memoria. Scarica il catalogo prima di uscire.'};$('download').onclick=()=>{let url=URL.createObjectURL(new Blob([JSON.stringify(a,null,2)],{type:'application/json'}));let l=document.createElement('a');l.href=url;l.download='resources.json';l.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};fetch('resources.json').then(r=>r.json()).then(r=>{a=r;fill()}).catch(()=>$('msg').textContent='Errore caricamento catalogo')</script></html>
