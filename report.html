<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segnalazioni</title><link rel="stylesheet" href="style.css"><main><a href="index.html">← Strumenti</a><h1>Segnalazioni</h1><p>Segnala un problema o suggerisci un link. Nessuna modifica automatica al catalogo. Il canale di invio non è ancora attivo: puoi preparare e copiare il testo.</p><form id="form"><label>Tipo <select id="kind"><option>Problema con un link</option><option>Suggerimento nuovo link</option></select></label><label id="reasonLabel">Motivo <select id="reason"><option>Link non funzionante</option><option>Indirizzo web cambiato</option><option>Servizio non più disponibile</option><option>Informazioni da aggiornare</option><option>Altro problema</option></select></label><label>Nome risorsa <input id="name" required></label><label>URL <input id="url" type="url"></label><label>Dettagli <textarea id="details"></textarea></label><button>Prepara segnalazione</button></form><p id="status" aria-live="polite"></p><textarea id="result" readonly aria-label="Testo della segnalazione"></textarea></main><script>const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);$('name').value=params.get('name')||'';$('url').value=params.get('url')||'';if(params.get('kind')==='new')$('kind').selectedIndex=1;const sync=()=>{$('reasonLabel').hidden=$('kind').selectedIndex===1;$('reason').disabled=$('reasonLabel').hidden};$('kind').onchange=sync;sync();$('form').onsubmit=e=>{e.preventDefault();$('result').value=['Tipo: '+$('kind').value,'Motivo: '+($('reason').disabled?'Nuova risorsa':$('reason').value),'Risorsa: '+$('name').value,'URL: '+$('url').value,'Dettagli: '+$('details').value].join('\n');$('status').textContent='Testo pronto da copiare. Nessun invio effettuato.';$('result').select()};</script></html>
