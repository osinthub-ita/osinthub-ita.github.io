<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Segnala o Suggerisci | OSINTHUB-ITA</title>
  <link rel="stylesheet" href="style.css?v=6.0">
</head>
<body>
  <header>
    <a class="logo" href="index.html">OSINTHUB<span>-</span><i>I</i>T<b>A</b></a>
    <a class="login-link" href="index.html">← Catalogo</a>
  </header>
  <main>
    <section class="auth-panel">
      <h1 id="repTitle">Segnala o suggerisci una risorsa</h1>
      <p>Aiutaci a mantenere aggiornato il catalogo OSINTHUB-ITA segnalando link non funzionanti o nuovi strumenti utili.</p>
      <form id="repForm">
        <label>Nome risorsa<input type="text" id="rName" required></label>
        <label>URL (https://)<input type="url" id="rUrl" required></label>
        <label>Note / Dettagli<textarea id="rNote" rows="4" required></textarea></label>
        <button type="submit" class="action">Invia segnalazione</button>
      </form>
      <p id="repStatus" class="green"></p>
    </section>
  </main>
  <script>
    const p = new URLSearchParams(location.search);
    if(p.get('name')) document.getElementById('rName').value = p.get('name');
    if(p.get('url')) document.getElementById('rUrl').value = p.get('url');
    document.getElementById('repForm').onsubmit = (e) => {
      e.preventDefault();
      let author = 'Ospite';
      try{
        const u = JSON.parse(localStorage.getItem('osinthub_user') || 'null');
        if(u && u.email) author = u.email;
      }catch{}
      const reports = JSON.parse(localStorage.getItem('osinthub_reports') || '[]');
      reports.unshift({
        name: document.getElementById('rName').value.trim(),
        url: document.getElementById('rUrl').value.trim(),
        note: document.getElementById('rNote').value.trim(),
        author,
        status: 'In revisione',
        date: new Date().toISOString()
      });
      localStorage.setItem('osinthub_reports', JSON.stringify(reports));
      document.getElementById('repStatus').textContent = 'Segnalazione registrata correttamente! Puoi seguirla nella tua Area Utente.';
      e.target.reset();
    };
  </script>
</body>
</html>
