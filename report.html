<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><main><a href="index.html">← Catalogo</a><h1>Segnala o proponi una risorsa</h1><p>Modulo locale: genera una segnalazione da copiare. Invio online non ancora attivo.</p><form id="f"><label>Risorsa <input id="n" required></label><label>Motivo <select id="r"><option>Link non funzionante</option><option>Sito chiuso</option><option>URL modificato</option><option>Duplicato</option><option>Variazione costo</option><option>Nuova risorsa</option><option>Altro</option></select></label><label>URL aggiornato <input id="u" type="url"></label><label>Dettagli <textarea id="d"></textarea></label><button>Genera testo</button></form><textarea id="out" readonly aria-label="Segnalazione generata"></textarea></main><script>n.value=new URLSearchParams(location.search).get('name')||'';f.onsubmit=e=>{e.preventDefault();out.value=[n.value,r.value,u.value,d.value].join('\n')}</script></html>
